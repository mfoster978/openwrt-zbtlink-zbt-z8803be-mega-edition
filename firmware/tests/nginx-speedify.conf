worker_processes 1;
pid /tmp/nginx-test.pid;
error_log /tmp/nginx-test.log;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server {
        listen 8080;
        listen 8443 ssl;
        server_name _;
        ssl_certificate /tmp/speedify-test.crt;
        ssl_certificate_key /tmp/speedify-test.key;
        root /www;
        include /repo/firmware/files/etc/nginx/conf.d/zbt-speedify-https.locations;
        include /usr/share/luci-app-speedify/luci-app-speedify.locations;
        location ^~ /cgi-bin/luci/ { return 200 'LuCI fixture'; }
    }
}
