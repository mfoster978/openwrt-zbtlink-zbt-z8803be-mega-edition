name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_git_ref:
        description: "OpenWrt git ref/branch/tag"
        required: true
        default: "openwrt-23.05"
      enable_openmptcp:
        description: "Enable OpenMPTCProuter feed/packages"
        required: true
        default: "false"
      include_backup_images:
        description: "Include artifacts/router-backups into image (if present)"
        required: true
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OPENWRT_ROOT: /workspace/openwrt
      OPENWRT_GIT_URL: https://github.com/openwrt/openwrt.git
      OPENWRT_GIT_REF: ${{ github.event.inputs.openwrt_git_ref }}
      ALLOW_CLONE_OPENWRT: "1"
      CUSTOM_FEED_DIR: /workspace/firmware/feeds
      FILES_OVERLAY_DIR: /workspace/firmware/files
      PROFILE_PACKAGES_FILE: /workspace/firmware/profiles/packages-default.txt
      PROFILE_KCONFIG_FILE: /workspace/firmware/profiles/kconfig-fragment.conf
      ENABLE_OPENMPTCP_INPUT: ${{ github.event.inputs.enable_openmptcp }}
      INCLUDE_BACKUP_IMAGES_INPUT: ${{ github.event.inputs.include_backup_images }}
      BACKUP_IMAGES_DIR: /workspace/artifacts/router-backups
      TARGET: mediatek/filogic
      SUBTARGET: filogic
      DEVICE: zbtlink_zbt-z8803be
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directories
        run: |
          mkdir -p artifacts/build-logs
          mkdir -p artifacts/build-output

      - name: Build remote builder image
        run: |
          docker build -f firmware/docker/Dockerfile.remote-builder -t owrt-remote-builder .

      - name: Run OpenWrt build
        run: |
          set -o pipefail
          ENABLE_OPENMPTCP=0
          INCLUDE_BACKUP_IMAGES=0
          if [ "${ENABLE_OPENMPTCP_INPUT}" = "true" ]; then ENABLE_OPENMPTCP=1; fi
          if [ "${INCLUDE_BACKUP_IMAGES_INPUT}" = "true" ]; then INCLUDE_BACKUP_IMAGES=1; fi
          docker run --rm \
            -e OPENWRT_ROOT \
            -e OPENWRT_GIT_URL \
            -e OPENWRT_GIT_REF \
            -e ALLOW_CLONE_OPENWRT \
            -e CUSTOM_FEED_DIR \
            -e FILES_OVERLAY_DIR \
            -e PROFILE_PACKAGES_FILE \
            -e PROFILE_KCONFIG_FILE \
            -e ENABLE_OPENMPTCP="${ENABLE_OPENMPTCP}" \
            -e INCLUDE_BACKUP_IMAGES="${INCLUDE_BACKUP_IMAGES}" \
            -e BACKUP_IMAGES_DIR \
            -e TARGET \
            -e SUBTARGET \
            -e DEVICE \
            -v "${PWD}:/workspace" \
            owrt-remote-builder \
            bash /workspace/firmware/docker/build-openwrt.sh \
            | tee artifacts/build-logs/openwrt-build.log
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            if [ -f openwrt/logs/tools/tar/dump.txt ]; then
              echo "===== openwrt/logs/tools/tar/dump.txt ====="
              cat openwrt/logs/tools/tar/dump.txt
            fi
            if [ -d openwrt/logs ]; then
              echo "===== openwrt/logs/*/dump.txt (head) ====="
              find openwrt/logs -name dump.txt -type f -print -exec sed -n '1,120p' {} \;
            fi
          fi
          exit "${rc}"

      - name: Collect build evidence
        if: always()
        run: |
          if [ -f openwrt/.config ]; then cp openwrt/.config artifacts/build-output/resolved.config; fi
          if [ -f openwrt/.config.bak ]; then cp openwrt/.config.bak artifacts/build-output/resolved.config.bak; fi
          if [ -d openwrt/bin/targets ]; then cp -a openwrt/bin/targets artifacts/build-output/targets; fi
          if [ -f firmware/scripts/verify-router-runtime.sh ]; then cp firmware/scripts/verify-router-runtime.sh artifacts/build-output/verify-router-runtime.sh; fi
          if [ -d firmware/files ]; then cp -a firmware/files artifacts/build-output/files-overlay; fi

      - name: Upload firmware artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-build-${{ github.run_number }}
          path: |
            artifacts/build-logs
            artifacts/build-output
          if-no-files-found: warn
          retention-days: 14
