name: Sanity
on:
  workflow_dispatch:
  push:
    paths: ['firmware/**', '.github/workflows/sanity.yml', '.github/workflows/build-openwrt-firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/sanity.yml', '.github/workflows/build-openwrt-firmware.yml']
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox jq patch ripgrep gcc nftables iproute2 python3
      - name: Validate firmware inputs
        run: bash firmware/scripts/check-build-inputs.sh
      - name: Verify pinned patches and behavioral regressions
        run: node firmware/tests/check-patches.cjs
      - name: Verify per-modem TTL on real IPv4 and IPv6 packets in an isolated network
        run: sudo env "PATH=$PATH" ZBT_TEST_NFT=1 unshare --net -- node --test firmware/tests/ttl.test.cjs
  speedtest-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq file
      - name: Test pinned measurement engine and build static ARM64 binary
        run: bash firmware/tests/check-speedtest.sh
  speedtest-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser test library
        run: npm install --prefix "$RUNNER_TEMP/zbt-ui" --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Check desktop and mobile live speed-test view
        run: NODE_PATH="$RUNNER_TEMP/zbt-ui/node_modules" node firmware/tests/speedtest-ui.cjs
      - name: Check Mega About and guarded firmware update screens
        run: |
          NODE_PATH="$RUNNER_TEMP/zbt-ui/node_modules" node firmware/tests/mega-about-ui.cjs
          NODE_PATH="$RUNNER_TEMP/zbt-ui/node_modules" node firmware/tests/firmware-updater-ui.cjs
  firmware-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq file
      - name: Test guarded release updater and compile ARM64 binary (no real flash)
        run: bash firmware/tests/check-firmware-updater.sh
