name: Sanity
on:
  workflow_dispatch:
  push:
    paths: ['firmware/**', '.github/workflows/sanity.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/sanity.yml']
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox jq patch ripgrep
      - name: Validate firmware inputs
        run: bash firmware/scripts/check-build-inputs.sh
      - name: Verify pinned patches and behavioral regressions
        run: node firmware/tests/check-patches.cjs
